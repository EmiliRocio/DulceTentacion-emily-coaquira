<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dulce Tentación | Pastelería Artesanal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #fff9f5;
      color: #3d2c2e;
    }
    /* Header estilo pastelería */
    header {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
      padding: 40px 20px;
      text-align: center;
      border-bottom: 4px solid #be185d;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: #9d174d;
      letter-spacing: 2px;
    }
    header p {
      font-size: 1.1rem;
      color: #6b2d4a;
      margin-top: 8px;
      font-weight: 300;
    }
    /* Barra de búsqueda */
    .buscador-container {
      max-width: 700px;
      margin: -25px auto 30px;
      display: flex;
      gap: 10px;
      padding: 0 20px;
    }
    .buscador-container input {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid #f8bbd0;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      background: white;
      box-shadow: 0 4px 15px rgba(190, 24, 93, 0.1);
    }
    .buscador-container input:focus {
      border-color: #be185d;
    }
    .buscador-container button {
      padding: 16px 28px;
      background: #be185d;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 15px rgba(190, 24, 93, 0.3);
    }
    .buscador-container button:hover {
      background: #9d174d;
    }
    /* Grid de postres */
    .catalogo {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
    }
    .postre-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .postre-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(190, 24, 93, 0.15);
    }
    .postre-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .postre-info {
      padding: 18px;
    }
    .postre-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #9d174d;
      margin-bottom: 6px;
    }
    .postre-info .categoria {
      display: inline-block;
      background: #fce4ec;
      color: #be185d;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .postre-info .origen {
      font-size: 0.85rem;
      color: #8d6e63;
      margin-bottom: 8px;
    }
    .postre-info .descripcion {
      font-size: 0.85rem;
      color: #6d4c41;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* Estados */
    .estado {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.2rem;
      color: #8d6e63;
    }
    .estado.error {
      color: #b91c1c;
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #fce4ec;
      border-top-color: #be185d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Footer */
    footer {
      text-align: center;
      padding: 30px;
      background: #fce4ec;
      color: #9d174d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🧁 Dulce Tentación</h1>
    <p>Pastelería artesanal</p>
  </header>

  <div class="buscador-container">
    <input type="text" id="inputBusqueda" placeholder="Busca un postre" />
    <button id="btnBuscar">Buscar</button>
  </div>

  <div id="contenedor" class="catalogo"></div>

  <footer>
    © 2026 Dulce Tentación · Los datos de recetas son cortesía de emily
  </footer>

  <script src="app.js"></script>
</body>
</html>
